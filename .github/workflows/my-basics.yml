#start my route to the actions!
name: My-GitHub-Actions
on:
    push:
        branches:
            - main
jobs:
    my-second-action:
        runs-on: ubuntu-latest
        steps:
            - name: Run my first action
              run: echo "Hello, GitHub Actions!"
    my-first-action:
        runs-on: ubuntu-latest
        needs: my-second-action
        steps:
            - name: Run my second action
              run: echo "This is my second action!"