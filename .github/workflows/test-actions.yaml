name: test_code
on: push
jobs:
    py-test:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: '3.12'
            - run: |
               ls -l
               pip install -r requirements.txt
            - run: pytest -v test_app.py


