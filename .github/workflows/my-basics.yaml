name: First Workflow
on:
  push:
    branches:
      - main
      #- "fix/*" # fix/page fix/about; CAN'T - fix/topic/about
      #- "fix/**" # CAN - fix/topic/about
      #- "!fix/smt" # Order is important
    # branches-ignore: # You have to choose between branches and branches-ignore
     # - "page/blog"
